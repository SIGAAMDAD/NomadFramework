# Version updates for the active NomadFramework/develop tree.
# Dependabot reads this file on the repo DEFAULT branch before scheduling.
# Security updates are configured separately and target the default branch.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "09:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
    groups:
      compatible-nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
